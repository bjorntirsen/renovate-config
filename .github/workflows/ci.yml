name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Re-validate weekly against the latest Renovate release, so a deprecated
  # option in the preset fails here before it breaks every consuming repo.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
      - name: Validate preset
        run: npx --yes --package renovate -- renovate-config-validator --strict default.json
      - name: Validate repo config
        run: npx --yes --package renovate -- renovate-config-validator --strict
